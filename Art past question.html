<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Questions Hub</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  font-family: Arial, sans-serif;
  background-color: #0b1220;
  color: #ffffff;
  min-height: 100vh;
  width: 100%;
  overflow-x: hidden;
}
nav {
  background-color: #111827;
  padding: 15px 25px;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
}
nav h3 {
  margin: 0;
  color: white;
  font-size: 20px;
  white-space: nowrap;
}

.nav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
}

nav a {
  color: #9ca3af;
  text-decoration: none;
  font-size: 14px;
  transition: 0.3s ease;
}

nav a:hover,
nav a.active {
  color: #ffffff;
}
.back-btn {
  position: fixed;
  top: 75px;
  left: 20px;
  z-index: 1000;
  width: auto;
  min-height: auto;
  padding: 8px 15px;
  background: transparent;
  border: 1px solid white;
  border-radius: 8px;
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: 0.3s ease;
}

.back-btn:hover {
  background: white;
  color: #272644;
  transform: none;
}
header {
  text-align: center;
  padding: 55px 20px 35px;
}

header h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin-bottom: 12px;
  line-height: 1.2;
}

header p {
  color: #9ca3af;
  font-size: 16px;
  line-height: 1.6;
}

.select-area {
  width: 100%;
  max-width: 900px;
  margin: 0 auto 35px;
  padding: 0 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

select {
  padding: 12px 35px 12px 12px;
  min-width: 160px;
  border-radius: 6px;
  background-color: #1f2937;
  color: white;
  border: 1px solid #374151;
  font-size: 14px;
  cursor: pointer;
  outline: none;
}

select:focus {
  border-color: #4f46e5;
}
.load-btn {
  padding: 12px 20px;
  background-color: #4f46e5;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: 0.3s ease;
}

.load-btn:hover {
  background-color: #4338ca;
  transform: translateY(-2px);
}
.container {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
  padding: 10px 20px 50px;
}

.item {
  background-color: #111827;
  border: 1px solid #374151;
  padding: 22px;
  margin-bottom: 15px;
  border-radius: 10px;
  width: 100%;
  transition: 0.3s ease;
}

.item:hover {
  border-color: #4f46e5;
  transform: translateY(-2px);
}

.item h3 {
  margin: 12px 0 20px;
  font-size: 20px;
  line-height: 1.4;
}
.tag-container {
  margin-bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  font-size: 12px;
  padding: 5px 9px;
  border-radius: 4px;
  color: white;
  display: inline-block;
  font-weight: bold;
}
/* subject */
.physics {
  background-color: #ef4444;
}
.chemistry {
  background-color: #22c55e;
}
.biology {
  background-color: #10b981;
}
.math {
  background-color: #3b82f6;
}
.english {
  background-color: #f59e0b;
}
.computer {
  background-color: #8b5cf6;
}
/* Exam */
.waec {
  background-color: #2563eb;
}
.neco {
  background-color: #059669;
}
.nabteb {
  background-color: #f97316;
}
.year {
  background-color: #4b5563;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.actions button {
  padding: 10px 16px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: 0.3s ease;
}
.actions button:hover {
  transform: translateY(-2px);
}
.practice {
  background-color: #059669;
  color: white;
}
.practice:hover {
  background-color: #047857;
}
.download {
  background-color: #2563eb;
  color: white;
}

.download:hover {
  background-color: #1d4ed8;
}
.bookmark {
  background-color: #4b5563;
  color: white;
}
.bookmark:hover {
  background-color: #374151;
}
.status-msg {
  text-align: center;
  color: #9ca3af;
  padding: 30px 20px;
  line-height: 1.6;
}

/* /Tablet response */
@media (max-width: 768px) {
  nav {
    flex-direction: column;
    justify-content: center;
    padding: 20px 15px;
    gap: 12px;
  }
  nav h3 {
    font-size: 22px;
  }
  .nav-links {
    width: 100%;
    gap: 12px 18px;
  }
  nav a {
    font-size: 14px;
  }
  .back-btn {
    top: 20px;
    left: 15px;
  }
  header {
    padding: 45px 20px 30px;
  }
  header h1 {
    font-size: 32px;
  }
  .select-area {
    flex-direction: column;
    padding: 0 20px;
  }
  select,
  .load-btn {
    width: 100%;
    max-width: 400px;
  }
  .container {
    padding: 10px 20px 40px;
  }
}
/* MObile  */
@media (max-width: 600px) {
  body {
    font-size: 14px;
  }
  nav {
    padding: 65px 15px 20px;
  }
  nav h3 {
    font-size: 20px;
  }
  .nav-links {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    width: 100%;
    max-width: 350px;
    gap: 12px;
    text-align: center;
  }
  nav a {
    padding: 8px;
    background-color: #1f2937;
    border-radius: 5px;
  }
  nav a:hover,nav a.active {
    background-color: #374151;
    color: white;
  }
  .back-btn {
    top: 15px;
    left: 15px;
    padding: 7px 12px;
    font-size: 13px;
  }
  header {
    padding: 35px 15px 25px;
  }
  header h1 {
    font-size: 27px;
  }
  header p {
    font-size: 14px;
  }
  .select-area {
    padding: 0 15px;
    margin-bottom: 25px;
    gap: 10px;
  }
  select,.load-btn {
    width: 100%;
    max-width: 100%;
    min-height: 46px;
  }
  .container {
    padding: 10px 15px 40px;
  }
  .item {
    padding: 18px 15px;
    border-radius: 8px;
  }
  .item h3 {
    font-size: 17px;
    line-height: 1.5;
  }
  /* TAGS */

  .tag {
    font-size: 11px;
    padding: 5px 8px;
  }
  .actions {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
  }
  .actions button {
    width: 100%;
    min-height: 44px;
  }

  .status-msg {
    font-size: 14px;
    padding: 25px 10px;
  }
}
</style>
</head>

<body>

<nav>
  <h3>EduPortal</h3>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="commercial note.html">Notes</a>
    <a href="commercial past question.html" class="active">Past Questions</a>
    <a href="commercial quiz.html">Quiz</a>
    <a href="commercial video.html">Videos</a>
  </div>
</nav>

<header>
  <h1>Past Examination Archive</h1>
  <p>Select your subject, exam board, and year below.</p>
</header>

<div class="select-area">
  <select id="subject">
    <option value="">Select Subject</option>
    <option value="government">Government</option>
    <option value="literature_in_english">Literature in English</option>
    <option value="yoruba">Yoruba</option>
    <option value="math">Mathematics</option>
    <option value="english">English</option>
    <option value="computer">Computer Studies</option>
    <option value="IRS">IRS</option>
    <option value="CRS">CRS</option>


  </select>

  <select id="exam">
    <option value="">Select Exam</option>
    <option value="waec">WAEC</option>
    <option value="neco">NECO</option>
    <option value="nabteb">NABTEB</option>
  </select>

  <select id="year">
    <option value="">Select Year</option>
    <option value="2023">2023</option>
    <option value="2022">2022</option>
    <option value="2021">2021</option>
  </select>

  <button class="load-btn" onclick="loadPapers()">Load Papers</button>
</div>

<div class="container" id="container">
  <div class="status-msg">Please select your filter options above to find papers.</div>
</div>

<script>
/* SIMPLE DATA STORE ARRANGEMENT */
const data = [
  {subject: "government", exam: "waec", year: "2023", title: "Government WAEC Past Paper 2023", file: "past/gov2023.pdf"},
  {subject: "literature_in_english", exam: "neco", year: "2022", title: "Literature in English NECO Past Paper 2022", file: "past/lit2022.pdf"},
  {subject: "yoruba", exam: "nabteb", year: "2021", title: "Yoruba NABTEB Past Paper 2021", file: "past/yoruba2021.pdf"}
];

/* MAIN FUNCTION FOR FILTERING AND SHOWING CARDS */
function loadPapers() {
  // Grab individual user values
  let selectedSubject = document.getElementById("subject").value;
  let selectedExam = document.getElementById("exam").value;
  let selectedYear = document.getElementById("year").value;
  let container = document.getElementById("container");

  // Empty out whatever content was previously shown inside our result block
  container.innerHTML = "";

  // Guard block: Check if user left a menu empty
  if (selectedSubject == "" || selectedExam == "" || selectedYear == "") {
    container.innerHTML = "<div class='status-msg'>Please select a value for all three dropdown rows.</div>";
    return;
  }

  let matchFound = false;

  // Standard beginner 'for' loop to search our database array
  for (let i = 0; i < data.length; i++) {
    let paper = data[i];

    // Simple strict comparison tests
    if (paper.subject == selectedSubject && paper.exam == selectedExam && paper.year == selectedYear) {
      matchFound = true;

      // Add HTML structure block piece by piece inside our list wrapper frame
      container.innerHTML += 
        "<div class='item'>" +
          "<div class='tag-container'>" +
            "<span class='tag " + paper.subject + "'>" + paper.subject + "</span>" +
            "<span class='tag " + paper.exam + "'>" + paper.exam.toUpperCase() + "</span>" +
            "<span class='tag year'>" + paper.year + "</span>" +
          "</div>" +
          "<h3>" + paper.title + "</h3>" +
          "<div class='actions'>" +
            "<button class='practice' onclick='openFile(\"" + paper.file + "\")'>Practice</button>" +
            "<button class='download' onclick='downloadFile(\"" + paper.file + "\")'>Download</button>" +
            "<button class='bookmark' onclick='saveBookmark(\"" + paper.title + "\")'>Save</button>" +
          "</div>" +
        "</div>";
    }
  }

  // Fallback text check if nothing matches the selection setup values
  if (matchFound == false) {
    container.innerHTML = "<div class='status-msg'>No exam papers matched your search criteria.</div>";
  }
}

function openFile(file) {
  window.open(file, "_blank");
}

function downloadFile(file) {
  window.location.href = file;
}

function saveBookmark(title) {
  alert("Saved paper: " + title);
}
</script>

</body>
</html>
