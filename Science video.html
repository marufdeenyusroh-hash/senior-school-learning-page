<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Science Lession Video page</title>
<script src="Science video.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI, sans-serif;
}
body{
  background:#0b1220;
  color:white;
}
header{
  padding:25px;
  text-align:center;
  background:linear-gradient(135deg,#0f172a,#1e3a8a);
}
header h1{
  font-size:26px;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:15px;
  background:#0f172a;
}
.controls button{
  padding:10px 14px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:#1f2937;
  color:white;
  transition:0.3s;
}
.controls button:hover{
  background:#2563eb;
}
.layout{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
  padding:20px;
}
.player-box{
  background:#111827;
  padding:15px;
  border-radius:15px;
}
.player-box iframe{
  width:100%;
  height:420px;
  border-radius:12px;
}
.list{
  background:#111827;
  padding:15px;
  border-radius:15px;
  max-height:500px;
  overflow:auto;
}
.video-item{
  padding:12px;
  margin-bottom:10px;
  background:#1f2937;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}
.video-item:hover{
  background:#2563eb;
}
.video-item.active{
  background:#2563eb;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:12px;
  padding:18px;
  background:rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.05);
}
/* DROPDOWN STYLE */
.controls select{
  appearance:none;
  -webkit-appearance:none;
  -moz-appearance:none;
  padding:12px 42px 12px 14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
  background:linear-gradient(145deg,#111827,#0b1220);
  color:#e5e7eb;
  font-size:14px;
  cursor:pointer;
  outline:none;
  transition:0.25s ease;
  min-width:140px;
  /* custom arrow */
  background-image:
    linear-gradient(45deg, transparent 50%, #9ca3af 50%),
    linear-gradient(135deg, #9ca3af 50%, transparent 50%);
  background-position:
    calc(100% - 18px) calc(50% - 3px),
    calc(100% - 12px) calc(50% - 3px);
  background-size:6px 6px;
  background-repeat:no-repeat;
}
.controls select:hover{
  border-color:#3b82f6;
  box-shadow:0 0 0 3px rgba(59,130,246,0.15);
  transform:translateY(-1px);
}
.controls select:focus{
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,0.25);
}
.controls button{
  padding:12px 18px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;
  font-weight:600;
  letter-spacing:0.3px;
  transition:0.25s ease;
}
.controls button:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 20px rgba(37,99,235,0.25);
}
.controls button:active{
  transform:scale(0.98);
}
/* RESPONSIVE */
@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }
  .player-box iframe{
    height:250px;
  }
}
#videoContainer{
  margin-top:20px;
}
#videoContainer iframe{
  width:100%;
  height:315px;
  margin-bottom:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
  <h1>📚 Science Video Learning Hub</h1>
  <p>SS1 – SS3 Complete Video Lessons</p>
</header>
<!-- CONTROL PANEL -->
<div class="controls">

  <!-- SUBJECT -->
  <select id="subjectSelect">
    <option value="physics">Physics</option>
    <option value="chemistry">Chemistry</option>
    <option value="biology">Biology</option>
    <option value="math">Mathematics</option>
    <option value="english">English</option>
    <option value="computer">Computer</option>
  </select>


  <button onclick="loadVideosFromDropdown()">Load Videos</button>

</div>
<!-- MAIN -->
<div class="layout">

  <!-- PLAYER -->
  <div class="player-box">
    <iframe id="player" src="" allowfullscreen>
    </iframe>
  </div>

  <!-- LIST -->
  <div class="list" id="videoList">
    <p style="color:#9ca3af">Select a subject to load lessons</p>
  </div>
</div>
  <div id="videoContainer"></div>

</body>
</html>
